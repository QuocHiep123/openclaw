# Topic-match fallback when prof papers thin
fallback:
  enabled: true
  # Searched as: ti:KEYWORD OR abs:KEYWORD on cs.CL/cs.AI/cs.LG
  keywords:
    - low-resource
    - multilingual
    - multi-agent
    - RLHF
    - alignment
    - reasoning
  max_papers: 15
