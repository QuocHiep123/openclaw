# Prof list for prof-curated paper retrieval via arxiv API.
#
# Strategy: query arxiv with `au:"Name"` + cs.CL/cs.AI filter, then disambiguate
# heuristically by co-authors + keywords (lab/affiliation/recent paper names),
# rejecting same-name authors in unrelated fields.
#
# The existing LLM relevance filter (in nlp_llm_research_pipeline.py) provides
# the second-pass safety net, so heuristic noise is acceptable.

profs:
  # === Tsinghua University ===
  - name_en: Zhiyuan Liu
    name_cn: 刘知远
    affiliation: Tsinghua University
    arxiv_au_query: 'au:"Zhiyuan Liu"'
    disambiguation:
      coauthors: [Maosong Sun, Xu Han, Ganqu Cui, Shengding Hu, Yuxiang Huang, Yujia Qin]
      keywords: [Tsinghua, OpenBMB, MiniCPM, KEPLER, ToolLLM, BMTrain, OpenKE, UltraChat, UltraFeedback]
      reject_keywords: [chemistry, biology, agricultural, medical, tumor, plant, clinical, hospital]
    topics: [llm, plm, knowledge, agents]

